{
  "name": "edge-pr-branches-base",
  "on": {
    "pull_request": {
      "tags": [
        "v*"
      ],
      "branches": [
        "edge-base-r-adcab986d657"
      ]
    },
    "push": {}
  },
  "permissions": {},
  "jobs": {
    "diagnostic": {
      "name": "edge-pr-branches-base",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 2,
      "steps": [
        {
          "name": "Record event",
          "run": "echo CASE=edge-pr-branches-base\njq '{action, number, ref, pull_request: (if .pull_request then {head: (.pull_request.head | {ref,sha}), base: (.pull_request.base | {ref,sha})} else null end)}' \"$GITHUB_EVENT_PATH\"\nprintf 'EVENT=%s\\nREF=%s\\nSHA=%s\\nRUN_ID=%s\\nATTEMPT=%s\\n' \"$GITHUB_EVENT_NAME\" \"$GITHUB_REF\" \"$GITHUB_SHA\" \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\"\n"
        }
      ]
    }
  }
}
